services:
  # 0. High-Performance Document Database
  mongo:
    image: mongo:7.0
    container_name: prowler-iasm-mongo
    restart: unless-stopped
    command: ["mongod", "--quiet"]
    ports:
      - "27017:27017"
    environment:
      - MONGO_INITDB_DATABASE=prowler_iasm
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet --eval 'db.adminCommand({ping: 1})'"]
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 1024M
        reservations:
          memory: 128M

  # 1. FastAPI REST Microservice
  iasm-api:
    image: prowler-iasm:latest
    build:
      context: .
      dockerfile: Dockerfile
    container_name: prowler-iasm-api
    restart: unless-stopped
    depends_on:
      mongo:
        condition: service_healthy
    ports:
      - "3755:3755"  # FastAPI REST API & Swagger UI (/docs)
    env_file:
      - path: .env
        required: false
    environment:
      - API_PORT=3755
      - MAX_CONCURRENT_SCANS=2
      - SCAN_OUTPUT_DIR=/app/scan_results
      - CORS_ORIGINS=*
      - MONGO_URI=mongodb://mongo:27017
      - MONGO_DB_NAME=prowler_iasm
    volumes:
      # Live development mount: code changes reflect immediately without rebuilding Docker
      - ./src:/app/src
      - ./run_scan.sh:/app/run_scan.sh
      # Persist scan reports, JSON data, and downloadable ZIP bundles on the host
      - ./scan_results:/app/scan_results
    command: ["uvicorn", "src.api.api:app", "--host", "0.0.0.0", "--port", "3755", "--reload"]
    deploy:
      resources:
        limits:
          memory: 2048M
        reservations:
          memory: 128M

  # 2. Streamlit Interactive Dashboard
  iasm-ui:
    image: prowler-iasm:latest
    build:
      context: .
      dockerfile: Dockerfile
    container_name: prowler-iasm-ui
    restart: unless-stopped
    depends_on:
      - iasm-api
    ports:
      - "8501:8501"  # Streamlit UI on http://localhost:8501
    environment:
      - API_BASE_URL=http://iasm-api:3755
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8501/_stcore/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    volumes:
      # Live development mount: Streamlit hot-reloads instantly on code changes
      - ./src:/app/src
      - ./scan_results:/app/scan_results
    command: ["streamlit", "run", "src/streamlit/streamlit.py", "--server.port=8501", "--server.address=0.0.0.0"]
    deploy:
      resources:
        limits:
          memory: 1024M
        reservations:
          memory: 128M

volumes:
  mongo_data:
